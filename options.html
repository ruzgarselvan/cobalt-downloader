<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Cobalt Downloader options</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 16px; min-width: 380px; }
  label { display: block; margin-bottom: 12px; }
  label > span { display: block; font-weight: 600; margin-bottom: 4px; }
  label.row { display: flex; gap: 8px; align-items: center; }
  input[type=text], input[type=password], select { width: 100%; box-sizing: border-box; padding: 5px 6px; }
  small { display: block; opacity: .65; margin-top: 3px; }
  h3 { margin: 20px 0 6px; font-size: 13px; }
  ul { margin: 0; padding-left: 18px; }
  .muted { opacity: .55; }
</style>

<label class="row"><input type="checkbox" id="watchClipboard"> Detect copied video links</label>
<small>The clipboard is only read inside this browser. A link is sent to a cobalt instance only when you press "Download".</small>

<label style="margin-top:12px"><span>Video quality</span>
  <select id="quality">
    <option value="max">Best available</option>
    <option>2160</option><option>1440</option><option>1080</option>
    <option>720</option><option>480</option><option>360</option>
  </select>
</label>

<label><span>Your own cobalt instance (optional)</span>
  <input type="text" id="customApi" placeholder="https://api.example.com">
  <small>When set, only this instance is used instead of the cobalt.directory list.</small>
</label>

<label><span>Instance API key (optional)</span>
  <input type="password" id="apiKey">
</label>

<label><span>TorBox API key (optional)</span>
  <input type="password" id="torboxKey">
  <small>When set, magnet links and file-host links (Mega, 1fichier, Google Drive…) are downloaded through TorBox. Video links still go to cobalt first; TorBox is tried if cobalt fails. Get your key at torbox.app → Settings.</small>
</label>

<h3>Instances from cobalt.directory <button id="refresh">Refresh</button></h3>
<ul id="list"><li class="muted">Loading…</li></ul>

<script type="module" src="options.js"></script>
